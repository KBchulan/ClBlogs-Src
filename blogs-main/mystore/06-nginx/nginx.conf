worker_processes auto;
daemon off;

pid logs/nginx.pid;

error_log logs/error.log;

events {
  worker_connections  10240;
  use epoll;
}

http {
  # 正常的日志
  access_log logs/access.log;
  # access_log off;

  # 开启零拷贝，提高文件传输效率
  # sendfile on;
  # tcp_nopush on;
  # tcp_nodelay on;

  # 开启缓存
  # proxy_cache_path ./temp/cache/ levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

  # 开启限流
  # limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

  upstream backend_servers {
    server 127.0.0.1:10000;
    server 127.0.0.1:10001;

    # keepalive 1000;
  }

  client_body_temp_path temp/client_body;
  proxy_temp_path       temp/proxy;
  fastcgi_temp_path     temp/fastcgi;
  uwsgi_temp_path       temp/uwsgi;
  scgi_temp_path        temp/scgi;

  server {
    listen      11828;
    server_name localhost;

    # 防止点击劫持攻击
    # add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
      root /home/chulan/code/ClBlogs-Src/pages-other/mystore/06-nginx;
      index ./html/index.html;
    }

    location /api/v1/ {
      # 开启缓存
      # proxy_cache my_cache;
      # proxy_cache_valid 200 302 10m;
      # proxy_cache_valid 404 1m;

      # limit_req zone=one burst=5 nodelay;

      proxy_pass http://backend_servers;

      # 开启对后端的 HTTP 1.1 支持
      # proxy_http_version 1.1;
      # 清空 Connection 头，防止客户端传来的 "Connection: close" 传给后端
      # proxy_set_header Connection "";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
